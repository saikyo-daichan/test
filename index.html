<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パジェロルーレット風ゲーム</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #222;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin-top: 50px;
        }
        h1 {
            color: #ffd700;
            text-shadow: 2px 2px 4px #000;
        }
        #roulette-container {
            position: relative;
            margin: 20px;
        }
        /* ルーレットの針（ダーツの代わり） */
        #pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff3333;
            z-index: 10;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.5));
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            background-color: #fff;
        }
        .controls {
            margin-top: 30px;
        }
        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            margin: 0 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 2px rgba(0,0,0,0.3);
        }
        #start-btn {
            background-color: #4CAF50;
            color: white;
        }
        #stop-btn {
            background-color: #f44336;
            color: white;
        }
        button:disabled {
            background-color: #777 !important;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <h1>ビッグチャンス！ダーツルーレット</h1>

    <div id="roulette-container">
        <div id="pointer"></div>
        <canvas id="rouletteCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <button id="start-btn">回転スタート！</button>
        <button id="stop-btn" disabled>ダーツを投げる！</button>
    </div>

    <div id="result"></div>

    <script>
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultDisplay = document.getElementById('result');

        // 賞品リスト（色とテキスト）
        const prizes = [
            { text: "パジェロ!!", color: "#FFD700" }, // ゴールド
            { text: "たわし", color: "#8B4513" }, // 茶色
            { text: "ハワイ旅行", color: "#00BFFF" }, // ブルー
            { text: "たわし", color: "#8B4513" },
            { text: "高級和牛", color: "#FF4500" }, // レッド
            { text: "たわし", color: "#8B4513" },
            { text: "パジェロ!!", color: "#FFD700" },
            { text: "たわし", color: "#8B4513" }
        ];

        const numPrizes = prizes.length;
        const arc = Math.PI * 2 / numPrizes; // 1マスの角度
        let currentAngle = 0; // 現在の回転角度
        let spinSpeed = 0; // 回転スピード
        let isSpinning = false;
        let isStopping = false;
        let animationId;

        // ルーレットを描画する関数
        function drawRoulette() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            for (let i = 0; i < numPrizes; i++) {
                const angle = currentAngle + i * arc;

                // セグメント（扇形）の描画
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.stroke();

                // テキストの描画
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = prizes[i].color === "#8B4513" ? "#FFF" : "#000"; // 背景色に合わせて文字色変更
                ctx.font = "bold 20px sans-serif";
                ctx.fillText(prizes[i].text, radius - 20, 10);
                ctx.restore();
            }
        }

        // 回転アニメーション
        function animate() {
            if (isSpinning) {
                currentAngle += spinSpeed;
                
                // 停止処理
                if (isStopping) {
                    spinSpeed *= 0.985; // 徐々に減速
                    if (spinSpeed < 0.002) {
                        isSpinning = false;
                        isStopping = false;
                        spinSpeed = 0;
                        determineResult();
                    }
                }

                drawRoulette();
                animationId = requestAnimationFrame(animate);
            }
        }

        // 結果を判定する関数
        function determineResult() {
            // 真上（270度 = 3π/2）に来ている項目を計算
            // 角度を0〜2πの範囲に正規化
            let normalizedAngle = currentAngle % (Math.PI * 2);
            if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

            // 針の位置は上（270度の位置なので、ルーレットの回転分を逆算）
            let pointerAngle = (Math.PI * 1.5 - normalizedAngle + Math.PI * 2) % (Math.PI * 2);
            let winningIndex = Math.floor(pointerAngle / arc);

            const prize = prizes[winningIndex].text;
            
            if(prize === "パジェロ!!") {
                resultDisplay.innerHTML = "🎉 大当たり！！「" + prize + "」獲得！！ 🎉";
                resultDisplay.style.color = "#FFD700";
            } else if (prize === "たわし") {
                resultDisplay.innerHTML = "残念...「" + prize + "」です。";
                resultDisplay.style.color = "#aaa";
            } else {
                resultDisplay.innerHTML = "おめでとうございます！「" + prize + "」獲得！";
                resultDisplay.style.color = "#00BFFF";
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        // スタートボタン
        startBtn.addEventListener('click', () => {
            if (!isSpinning) {
                isSpinning = true;
                isStopping = false;
                spinSpeed = 0.2 + Math.random() * 0.1; // 初速を少しランダムに
                resultDisplay.innerHTML = "";
                startBtn.disabled = true;
                stopBtn.disabled = false;
                animate();
            }
        });

        // ストップ（ダーツ投擲）ボタン
        stopBtn.addEventListener('click', () => {
            if (isSpinning && !isStopping) {
                isStopping = true;
                stopBtn.disabled = true; // 何度も押せないようにする
            }
        });

        // 初期描画
        drawRoulette();
    </script>
</body>
</html>
