<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTMLコマンドバトルゲーム</title>
<style>
    :root {
        --primary: #ffd700;
        --bg: #111;
        --panel: #222;
        --text: #eee;
    }
    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        user-select: none;
    }
    #game-container {
        width: 100%;
        max-width: 600px;
        height: 100vh;
        max-height: 800px;
        background: #000;
        border: 2px solid #444;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .screen {
        display: none;
        flex-direction: column;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
    }
    .screen.active {
        display: flex;
    }
    h1, h2 { text-align: center; color: var(--primary); margin-top: 0; }
    button {
        background: #333; color: white; border: 2px solid #555; padding: 10px 20px;
        font-size: 16px; cursor: pointer; border-radius: 5px; margin: 5px;
        transition: 0.2s;
    }
    button:hover { background: #555; border-color: var(--primary); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Deck & Enemy Selection */
    .grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .card {
        background: var(--panel); border: 2px solid #555; border-radius: 8px;
        width: 30%; min-width: 120px; padding: 10px; text-align: center; cursor: pointer;
    }
    .card:hover { border-color: var(--primary); }
    .card.selected { border-color: #0f0; background: #040; }
    .emoji { font-size: 40px; margin: 10px 0; }
    .stats { font-size: 12px; color: #aaa; }

    .enemy-group {
        background: var(--panel); border: 2px solid #555; border-radius: 8px;
        padding: 15px; margin-bottom: 10px; cursor: pointer; display: flex;
        justify-content: space-around;
    }
    .enemy-group:hover { border-color: #f00; background: #400; }

    /* Battle Screen */
    .battle-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .team { display: flex; justify-content: space-around; align-items: flex-end; height: 150px; }
    .team.enemies { align-items: flex-start; }
    .battler {
        background: var(--panel); border: 2px solid #555; border-radius: 8px;
        padding: 10px; text-align: center; width: 30%; position: relative;
        transition: transform 0.2s;
    }
    .battler.active-turn { border-color: var(--primary); transform: translateY(-10px); box-shadow: 0 0 10px var(--primary); }
    .battler.dead { opacity: 0.3; filter: grayscale(100%); }
    .hp-bar-bg { background: #555; height: 10px; border-radius: 5px; margin-top: 5px; overflow: hidden; }
    .hp-bar-fill { background: #0f0; height: 100%; transition: width 0.3s; }
    
    #message-box {
        background: rgba(0,0,0,0.8); border: 2px solid var(--primary); border-radius: 8px;
        padding: 15px; height: 120px; font-size: 18px; text-align: center;
        display: flex; flex-direction: column; justify-content: center;
    }
    .command-roulette { font-size: 24px; font-weight: bold; color: var(--primary); margin-top: 10px; }
</style>
</head>
<body>

<div id="game-container">
    <div id="screen-title" class="screen active">
        <h1 style="margin-top: 40%;">モンスターバトル<br>〜ブラウザ版〜</h1>
        <p style="text-align:center; color:#aaa;">※音声が出ます</p>
        <div style="text-align: center;">
            <button onclick="initGame()">ゲームスタート</button>
        </div>
    </div>

    <div id="screen-deck" class="screen">
        <h2>チーム編成 (3体選ぶ)</h2>
        <div class="grid" id="deck-grid"></div>
        <div style="text-align: center; margin-top: 20px;">
            <p id="deck-count">選択中: 0 / 3</p>
            <button id="btn-next-enemy" onclick="showEnemySelect()" disabled>敵を探す</button>
        </div>
    </div>

    <div id="screen-enemy" class="screen">
        <h2>戦う敵を選べ！</h2>
        <div id="enemy-list" style="overflow-y: auto; flex: 1;"></div>
    </div>

    <div id="screen-battle" class="screen">
        <div class="battle-area">
            <div class="team enemies" id="battle-enemies"></div>
            <div id="message-box">
                <div id="battle-msg">バトル開始！</div>
                <div id="battle-roulette" class="command-roulette"></div>
            </div>
            <div class="team players" id="battle-players"></div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h1 id="result-title" style="margin-top: 40%;"></h1>
        <div style="text-align: center;">
            <button onclick="resetGame()">タイトルへ戻る</button>
        </div>
    </div>
</div>

<script>
    // --- Sound System (Web Audio API) ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }
    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'select') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'roulette') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.05, now);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'attack') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'damage') {
            osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'win') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1); osc.frequency.setValueAtTime(659, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        }
    }

    // --- Game Data ---
    const DB_MONSTERS = [
        { id: 1, name: "戦士", emoji: "⚔️", hp: 120, atk: 30, spd: 40, cmds: [{name:"こうげき", pow:1}, {name:"会心の一撃", pow:2}, {name:"ミス", pow:0}, {name:"こうげき", pow:1}] },
        { id: 2, name: "魔法使い", emoji: "🧙", hp: 80, atk: 40, spd: 30, cmds: [{name:"ファイア", pow:1.2}, {name:"大魔法", pow:2.5}, {name:"ミス", pow:0}, {name:"ファイア", pow:1.2}] },
        { id: 3, name: "盗賊", emoji: "🗡️", hp: 90, atk: 20, spd: 80, cmds: [{name:"2回こうげき", pow:1.5}, {name:"こうげき", pow:1}, {name:"ミス", pow:0}, {name:"こうげき", pow:1}] },
        { id: 4, name: "騎士", emoji: "🛡️", hp: 150, atk: 25, spd: 20, cmds: [{name:"かばう(攻撃)", pow:0.8}, {name:"シールドバッシュ", pow:1.5}, {name:"こうげき", pow:1}, {name:"ミス", pow:0}] },
        { id: 5, name: "ドラゴン", emoji: "🐉", hp: 200, atk: 50, spd: 50, cmds: [{name:"ほのお", pow:1.2}, {name:"かみくだく", pow:2}, {name:"ミス", pow:0}, {name:"ためる(ミス)", pow:0}] },
        { id: 6, name: "スライム", emoji: "💧", hp: 50, atk: 10, spd: 60, cmds: [{name:"たいあたり", pow:1}, {name:"分裂(攻撃)", pow:1.5}, {name:"ミス", pow:0}, {name:"ミス", pow:0}] }
    ];

    let playerDeck = [];
    let enemyDeck = [];
    let allFighters = [];

    // --- Core Functions ---
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function initGame() {
        initAudio();
        playSound('select');
        playerDeck = [];
        renderDeckBuilder();
        switchScreen('screen-deck');
    }

    function renderDeckBuilder() {
        const grid = document.getElementById('deck-grid');
        grid.innerHTML = '';
        DB_MONSTERS.forEach(m => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<div class="emoji">${m.emoji}</div><b>${m.name}</b><div class="stats">HP:${m.hp}<br>SPD:${m.spd}</div>`;
            el.onclick = () => {
                if (playerDeck.includes(m)) {
                    playerDeck = playerDeck.filter(c => c !== m);
                    el.classList.remove('selected');
                } else if (playerDeck.length < 3) {
                    playerDeck.push(m);
                    el.classList.add('selected');
                    playSound('select');
                }
                document.getElementById('deck-count').innerText = `選択中: ${playerDeck.length} / 3`;
                document.getElementById('btn-next-enemy').disabled = playerDeck.length !== 3;
            };
            grid.appendChild(el);
        });
    }

    function showEnemySelect() {
        playSound('select');
        const list = document.getElementById('enemy-list');
        list.innerHTML = '';
        // 3〜5のランダムな敵パーティを生成
        const groupCount = Math.floor(Math.random() * 3) + 3; 
        
        for (let i = 0; i < groupCount; i++) {
            const enemyCount = Math.floor(Math.random() * 3) + 1; // 1〜3体
            let team = [];
            let html = '';
            for (let j = 0; j < enemyCount; j++) {
                const randomMob = DB_MONSTERS[Math.floor(Math.random() * DB_MONSTERS.length)];
                team.push(JSON.parse(JSON.stringify(randomMob))); // ディープコピー
                html += `<div style="text-align:center"><div style="font-size:30px;">${randomMob.emoji}</div><small>${randomMob.name}</small></div>`;
            }
            const groupEl = document.createElement('div');
            groupEl.className = 'enemy-group';
            groupEl.innerHTML = html;
            groupEl.onclick = () => startBattle(team);
            list.appendChild(groupEl);
        }
        switchScreen('screen-enemy');
    }

    // --- Battle System ---
    function startBattle(enemies) {
        playSound('select');
        enemyDeck = enemies;
        // ファイターデータの初期化
        allFighters = [];
        playerDeck.forEach((m, i) => allFighters.push({ ...m, isPlayer: true, currentHp: m.hp, index: i }));
        enemyDeck.forEach((m, i) => allFighters.push({ ...m, isPlayer: false, currentHp: m.hp, index: i }));
        
        renderBattleField();
        switchScreen('screen-battle');
        msg("バトル開始！");
        setTimeout(battleLoop, 1500);
    }

    function renderBattleField() {
        const pContainer = document.getElementById('battle-players');
        const eContainer = document.getElementById('battle-enemies');
        pContainer.innerHTML = ''; eContainer.innerHTML = '';

        allFighters.forEach(f => {
            const hpPercent = Math.max(0, (f.currentHp / f.hp) * 100);
            const html = `
                <div class="battler ${f.currentHp <= 0 ? 'dead' : ''}" id="fighter-${f.isPlayer?'p':'e'}-${f.index}">
                    <div style="font-size:30px;">${f.emoji}</div>
                    <div style="font-size:12px; font-weight:bold;">${f.name}</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${hpPercent}%; background:${hpPercent<30?'red':'#0f0'};"></div></div>
                </div>
            `;
            if (f.isPlayer) pContainer.innerHTML += html;
            else eContainer.innerHTML += html;
        });
    }

    function msg(text) { document.getElementById('battle-msg').innerText = text; document.getElementById('battle-roulette').innerText = ""; }
    function msgRoulette(text) { document.getElementById('battle-roulette').innerText = text; }

    async function battleLoop() {
        // 生きているキャラを抽出
        const alive = allFighters.filter(f => f.currentHp > 0);
        
        // 勝敗判定
        const pAlive = alive.filter(f => f.isPlayer).length;
        const eAlive = alive.filter(f => !f.isPlayer).length;
        
        if (pAlive === 0) { showResult(false); return; }
        if (eAlive === 0) { showResult(true); return; }

        // スピード順（同速はランダム）でソートし、最初のキャラが行動
        alive.sort((a, b) => b.spd - a.spd || Math.random() - 0.5);
        const attacker = alive[0]; // 今回のターンは一番早いキャラ（※本来のターン制ならキュー管理ですが、簡易的に毎ターン最速が動く仕様にします。行動済みフラグで管理するフルターン制に変更）

        // ※簡易ターン制: 毎ターン全員の行動順を決めるキュー方式
        let turnQueue = [...alive];
        
        const executeNextTurn = async () => {
            if (turnQueue.length === 0) {
                setTimeout(battleLoop, 500); // 次のラウンドへ
                return;
            }
            
            const current = turnQueue.shift();
            if (current.currentHp <= 0) { executeNextTurn(); return; } // 死んでたらスキップ

            // 勝敗判定(途中)
            if (allFighters.filter(f => f.isPlayer && f.currentHp > 0).length === 0) { showResult(false); return; }
            if (allFighters.filter(f => !f.isPlayer && f.currentHp > 0).length === 0) { showResult(true); return; }

            // アクティブ表示
            document.querySelectorAll('.battler').forEach(el => el.classList.remove('active-turn'));
            document.getElementById(`fighter-${current.isPlayer?'p':'e'}-${current.index}`).classList.add('active-turn');
            
            msg(`${current.name}のターン！`);
            
            // ルーレット演出 (約1秒)
            const chosenCmd = await playRoulette(current.cmds);
            
            // ターゲット選択（ランダムな敵対対象）
            const targets = allFighters.filter(f => f.isPlayer !== current.isPlayer && f.currentHp > 0);
            const target = targets[Math.floor(Math.random() * targets.length)];

            // ダメージ計算
            if (chosenCmd.pow > 0) {
                playSound('attack');
                const damage = Math.floor(current.atk * chosenCmd.pow * (0.8 + Math.random() * 0.4));
                target.currentHp -= damage;
                msg(`${current.name}の ${chosenCmd.name}！\n${target.name}に ${damage} ダメージ！`);
                playSound('damage');
            } else {
                msg(`${current.name}の ${chosenCmd.name}！\nしかし なにもおきなかった！`);
            }

            renderBattleField();

            setTimeout(executeNextTurn, 1500);
        };

        executeNextTurn();
    }

    function playRoulette(cmds) {
        return new Promise(resolve => {
            let ticks = 0;
            const maxTicks = 15;
            const interval = setInterval(() => {
                const randomCmd = cmds[Math.floor(Math.random() * cmds.length)];
                msgRoulette(`▶ ${randomCmd.name} ◀`);
                playSound('roulette');
                ticks++;
                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    // 最終決定
                    const finalCmd = cmds[Math.floor(Math.random() * cmds.length)];
                    msgRoulette(`★ ${finalCmd.name} ★`);
                    setTimeout(() => resolve(finalCmd), 500);
                }
            }, 80);
        });
    }

    function showResult(isWin) {
        if (isWin) playSound('win');
        document.getElementById('result-title').innerText = isWin ? "YOU WIN!!" : "GAME OVER...";
        document.getElementById('result-title').style.color = isWin ? "#0f0" : "#f00";
        switchScreen('screen-result');
    }

    function resetGame() { switchScreen('screen-title'); }
</script>

</body>
</html>
