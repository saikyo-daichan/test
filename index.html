<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>本格クラロワ風 RTSゲーム</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; /* スマホの不要なスクロールを防止 */ }
        body { background-color: #111; color: #fff; font-family: 'Courier New', Courier, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* 画面サイズに合わせてアスペクト比を維持（スマホ完全対応） */
        #game-container { position: relative; width: 100vw; height: calc(100vw * 7 / 4); max-height: 100vh; max-width: calc(100vh * 4 / 7); background: #4caf50; border: 2px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer { position: absolute; bottom: 0; width: 100%; height: 22%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; z-index: 10; border-top: 2px solid #555; }
        #elixir-bar-container { width: 90%; height: 15px; background: #333; margin: 8px auto; border-radius: 10px; border: 2px solid #555; position: relative; overflow: hidden; flex-shrink: 0; }
        #elixir-bar { height: 100%; width: 0%; background: #e91e63; transition: width 0.1s linear; }
        #elixir-text { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: bold; line-height: 15px; text-shadow: 1px 1px 0 #000; }
        
        #cards-container { display: flex; justify-content: space-evenly; align-items: center; flex: 1; padding: 5px; width: 100%; }
        .card { width: 18%; aspect-ratio: 3/4; background: #ddd; border: 2px solid #fff; border-radius: 8px; position: relative; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #000; font-weight: bold; transition: transform 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card:active { cursor: grabbing; transform: scale(1.05); }
        .card.disabled { opacity: 0.4; filter: grayscale(100%); cursor: not-allowed; }
        
        .card-cost { position: absolute; top: -8px; left: -8px; background: #e91e63; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid #fff; z-index: 2;}
        .card-emoji { font-size: 28px; margin-bottom: 2px; }
        .card-name { font-size: 10px; text-align: center; line-height: 1.1; word-break: keep-all; }
        
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #4caf50; color: #fff; border: 2px solid #fff; border-radius: 8px; margin-top: 20px; font-weight: bold; font-family: inherit; box-shadow: 0 4px 0 #2e7d32; transition: all 0.1s; }
        button:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="700"></canvas>
    
    <div id="ui-layer">
        <div id="elixir-bar-container">
            <div id="elixir-bar"></div>
            <div id="elixir-text">0 / 10</div>
        </div>
        <div id="cards-container">
            <!-- Cards will be injected here via JS -->
        </div>
    </div>

    <div id="overlay">
        <h1 style="color:#ffeb3b; text-align:center; text-shadow: 2px 2px 0 #000;">タワーディフェンス<br>プロトタイプ</h1>
        <p style="margin-top:20px; font-size:14px; text-align:center; line-height:1.6;">カードをドラッグ＆ドロップして<br>味方を召喚しよう！</p>
        <button id="start-btn">GAME START</button>
    </div>
</div>

<script>
/**
 * -------------------------------------------------------------
 * 1. 数学・ユーティリティエンジン (Vector Math & Utils)
 * -------------------------------------------------------------
 */
class Vec2 {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() { let m = this.mag(); return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m); }
    dist(v) { return this.sub(v).mag(); }
}

const Utils = {
    randomRange: (min, max) => Math.random() * (max - min) + min,
    randomInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min
};

/**
 * -------------------------------------------------------------
 * 2. サウンドエンジン (Web Audio API)
 * -------------------------------------------------------------
 */
class SoundEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.enabled = false;
    }
    init() { if(this.ctx.state === 'suspended') this.ctx.resume(); this.enabled = true; }
    playTone(freq, type, duration, vol=0.1) {
        if(!this.enabled) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    }
    playSpawn() { this.playTone(440, 'square', 0.1, 0.05); setTimeout(() => this.playTone(660, 'square', 0.15, 0.05), 100); }
    playAttackMelee() { this.playTone(150, 'sawtooth', 0.1, 0.08); }
    playAttackRange() { this.playTone(800, 'sine', 0.1, 0.05); }
    playHit() { this.playTone(100, 'square', 0.1, 0.1); }
    playTowerDestroy() { this.playTone(50, 'sawtooth', 0.5, 0.2); setTimeout(() => this.playTone(40, 'sawtooth', 0.8, 0.2), 200); }
    playElixirMax() { this.playTone(1200, 'sine', 0.2, 0.05); }
}
const audio = new SoundEngine();

/**
 * -------------------------------------------------------------
 * 3. エンティティシステム (Unit, Tower with Emojis)
 * -------------------------------------------------------------
 */
class GameObject {
    constructor(x, y, team) {
        this.pos = new Vec2(x, y);
        this.team = team;
        this.hp = 100;
        this.maxHp = 100;
        this.radius = 15;
        this.active = true;
    }
    takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) { this.hp = 0; this.active = false; }
    }
}

class Tower extends GameObject {
    constructor(x, y, team, isKing) {
        super(x, y, team);
        this.isKing = isKing;
        this.radius = isKing ? 30 : 25;
        this.maxHp = isKing ? 2500 : 1500;
        this.hp = this.maxHp;
        this.range = 150;
        this.damage = isKing ? 50 : 70;
        this.atkCooldown = 1.0;
        this.atkTimer = 0;
        this.activeAttack = !isKing; 
        this.emoji = isKing ? '👑' : '🏰';
    }
    update(dt, game) {
        if (!this.activeAttack) return;
        this.atkTimer -= dt;
        if (this.atkTimer <= 0) {
            let target = this.findTarget(game.units);
            if (target) {
                target.takeDamage(this.damage);
                audio.playAttackRange();
                game.particles.addProjectile(this.pos, target, this.team);
                this.atkTimer = this.atkCooldown;
            }
        }
    }
    findTarget(units) {
        let closest = null, minDist = this.range;
        for (let u of units) {
            if (u.team !== this.team && u.active) {
                let d = this.pos.dist(u.pos);
                if (d < minDist) { minDist = d; closest = u; }
            }
        }
        return closest;
    }
    draw(ctx) {
        // 土台
        ctx.fillStyle = this.team === 0 ? '#1e88e5' : '#e53935';
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // 絵文字描画
        ctx.font = `${this.radius * 1.2}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.emoji, this.pos.x, this.pos.y);
        
        // HPバー
        const hpRatio = this.hp / this.maxHp;
        ctx.fillStyle = 'red';
        ctx.fillRect(this.pos.x - this.radius, this.pos.y - this.radius - 12, this.radius*2, 5);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(this.pos.x - this.radius, this.pos.y - this.radius - 12, this.radius*2 * hpRatio, 5);
    }
}

class Unit extends GameObject {
    constructor(x, y, team, typeData) {
        super(x, y, team);
        this.type = typeData.name;
        this.emoji = typeData.emoji;
        this.maxHp = typeData.hp;
        this.hp = this.maxHp;
        this.damage = typeData.damage;
        this.speed = typeData.speed;
        this.range = typeData.range;
        this.atkCooldown = typeData.atkCooldown;
        this.radius = typeData.radius;
        this.color = typeData.color;
        this.isRanged = typeData.range > 30;
        
        this.atkTimer = 0;
        this.target = null;
        this.state = 'MOVE';
    }
    update(dt, game) {
        this.atkTimer -= dt;
        if (!this.target || !this.target.active) {
            this.target = this.findClosestEnemy(game);
            this.state = 'MOVE';
        }

        if (this.target) {
            let dist = this.pos.dist(this.target.pos);
            if (dist <= this.range) {
                this.state = 'ATTACK';
                if (this.atkTimer <= 0) {
                    this.target.takeDamage(this.damage);
                    if(this.isRanged) {
                        audio.playAttackRange();
                        game.particles.addProjectile(this.pos, this.target, this.team);
                    } else {
                        audio.playAttackMelee();
                        audio.playHit();
                    }
                    this.atkTimer = this.atkCooldown;
                }
            } else {
                this.state = 'MOVE';
                let dir = this.target.pos.sub(this.pos).normalize();
                
                let separation = new Vec2(0,0);
                for(let other of game.units) {
                    if(other !== this && other.active) {
                        let d = this.pos.dist(other.pos);
                        if(d < this.radius + other.radius) {
                            separation = separation.add(this.pos.sub(other.pos).normalize().mult(0.5));
                        }
                    }
                }
                dir = dir.add(separation).normalize();
                this.pos = this.pos.add(dir.mult(this.speed * dt));
            }
        } else {
             let moveDir = this.team === 0 ? -1 : 1;
             this.pos.y += moveDir * this.speed * dt;
        }
    }
    findClosestEnemy(game) {
        let closest = null, minDist = Infinity;
        let enemies = [].concat(game.units, game.towers).filter(e => e.team !== this.team && e.active);
        for (let e of enemies) {
            let d = this.pos.dist(e.pos);
            if (d < minDist) { minDist = d; closest = e; }
        }
        return closest;
    }
    draw(ctx) {
        // 背景カラー
        ctx.fillStyle = this.team === 0 ? this.color : '#e57373';
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = this.team === 0 ? '#1565c0' : '#b71c1c';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 絵文字描画
        ctx.font = `${this.radius * 1.2}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.emoji, this.pos.x, this.pos.y);

        // 攻撃モーション（白枠点滅）
        if(this.state === 'ATTACK' && this.atkTimer > this.atkCooldown - 0.2) {
            ctx.beginPath();
            ctx.arc(this.pos.x, this.pos.y, this.radius + 3, 0, Math.PI * 2);
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }

        // HPバー
        const hpRatio = this.hp / this.maxHp;
        ctx.fillStyle = 'red';
        ctx.fillRect(this.pos.x - 10, this.pos.y - this.radius - 6, 20, 3);
        ctx.fillStyle = '#00e676';
        ctx.fillRect(this.pos.x - 10, this.pos.y - this.radius - 6, 20 * hpRatio, 3);
    }
}

/**
 * -------------------------------------------------------------
 * 4. パーティクル (飛び道具)
 * -------------------------------------------------------------
 */
class ParticleSystem {
    constructor() { this.projectiles = []; }
    addProjectile(start, target, team) {
        this.projectiles.push({ pos: new Vec2(start.x, start.y), target: target, speed: 400, team: team, active: true });
    }
    update(dt) {
        for(let p of this.projectiles) {
            if(!p.target.active) { p.active = false; continue; }
            let dir = p.target.pos.sub(p.pos).normalize();
            p.pos = p.pos.add(dir.mult(p.speed * dt));
            if(p.pos.dist(p.target.pos) < 10) { p.active = false; audio.playHit(); }
        }
        this.projectiles = this.projectiles.filter(p => p.active);
    }
    draw(ctx) {
        for(let p of this.projectiles) {
            ctx.fillStyle = p.team === 0 ? '#bbdefb' : '#ffcdd2';
            ctx.beginPath(); ctx.arc(p.pos.x, p.pos.y, 4, 0, Math.PI*2); ctx.fill();
        }
    }
}

/**
 * -------------------------------------------------------------
 * 5. カードデッキシステム (絵文字追加)
 * -------------------------------------------------------------
 */
const CardDB = [
    { id: 'knight', name: 'ナイト', emoji: '⚔️', cost: 3, hp: 800, damage: 80, speed: 60, range: 20, atkCooldown: 1.2, radius: 14, color: '#90caf9', count: 1 },
    { id: 'archer', name: 'アーチャー', emoji: '🏹', cost: 3, hp: 300, damage: 60, speed: 60, range: 120, atkCooldown: 1.0, radius: 12, color: '#a5d6a7', count: 2 },
    { id: 'giant', name: 'ジャイアント', emoji: '👹', cost: 5, hp: 2000, damage: 120, speed: 40, range: 25, atkCooldown: 2.0, radius: 20, color: '#ffcc80', count: 1 },
    { id: 'goblin', name: 'ゴブリン', emoji: '🗡️', cost: 2, hp: 200, damage: 50, speed: 90, range: 15, atkCooldown: 0.8, radius: 10, color: '#81c784', count: 3 }
];

class Player {
    constructor(isCPU = false) {
        this.isCPU = isCPU;
        this.elixir = 5;
        this.maxElixir = 10;
        this.elixirRate = 1.0; 
        
        this.deck = [...CardDB, ...CardDB]; 
        this.shuffleDeck();
        this.hand = [];
        for(let i=0; i<4; i++) this.hand.push(this.deck.pop());
        this.drawCardToNext();
        this.cpuTimer = 0;
    }
    shuffleDeck() {
        for (let i = this.deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
        }
    }
    drawCardToNext() {
        if(this.deck.length === 0) {
            this.deck = [...CardDB, ...CardDB];
            this.shuffleDeck();
        }
        this.nextCard = this.deck.pop();
    }
    useCard(index) {
        let card = this.hand[index];
        if (this.elixir >= card.cost) {
            this.elixir -= card.cost;
            this.hand.splice(index, 1);
            this.hand.push(this.nextCard);
            this.drawCardToNext();
            return card;
        }
        return null;
    }
    update(dt, game) {
        if (this.elixir < this.maxElixir) {
            this.elixir += this.elixirRate * dt;
            if(this.elixir >= this.maxElixir && !this.isCPU && Math.floor(this.elixir - this.elixirRate * dt) < 10) {
                audio.playElixirMax();
            }
        }
        if (this.isCPU) {
            this.cpuTimer += dt;
            if (this.cpuTimer > 3.5) { 
                let playableIdx = this.hand.findIndex(c => c.cost <= this.elixir);
                if (playableIdx !== -1 && Math.random() > 0.3) {
                    let card = this.useCard(playableIdx);
                    let spawnX = Math.random() > 0.5 ? 100 : 300; 
                    let spawnY = 150; 
                    for(let i=0; i<card.count; i++) {
                         let offset = new Vec2(Utils.randomRange(-15,15), Utils.randomRange(-15,15));
                         game.spawnUnit(spawnX + offset.x, spawnY + offset.y, 1, card);
                    }
                    audio.playSpawn();
                }
                this.cpuTimer = 0;
            }
        }
    }
}

/**
 * -------------------------------------------------------------
 * 6. メインエンジン (ドラッグ＆ドロップ対応)
 * -------------------------------------------------------------
 */
class GameEngine {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.width = this.canvas.width;
        this.height = this.canvas.height;
        this.lastTime = performance.now();
        this.state = 'START';
        this.particles = new ParticleSystem();
        this.towers = [];
        this.units = [];
        this.player = new Player(false);
        this.enemy = new Player(true);
        
        // Drag variables
        this.draggingCardIndex = -1;
        this.draggingCard = null;
        this.dragEl = null;
        this.previewPos = null;

        this.setupTowers();
        this.setupUI();
        this.bindGlobalDragEvents();
    }
    
    setupTowers() {
        this.towers.push(new Tower(this.width / 2, this.height - 40, 0, true));
        this.towers.push(new Tower(80, this.height - 180, 0, false));
        this.towers.push(new Tower(this.width - 80, this.height - 180, 0, false));
        
        this.towers.push(new Tower(this.width / 2, 40, 1, true));
        this.towers.push(new Tower(80, 180, 1, false));
        this.towers.push(new Tower(this.width - 80, 180, 1, false));
    }

    setupUI() {
        this.cardsContainer = document.getElementById('cards-container');
        this.renderHandUI();
    }

    renderHandUI() {
        this.cardsContainer.innerHTML = '';
        this.player.hand.forEach((card, idx) => {
            let div = document.createElement('div');
            div.className = `card ${this.player.elixir >= card.cost ? '' : 'disabled'}`;
            div.innerHTML = `
                <div class="card-cost">${card.cost}</div>
                <div class="card-emoji">${card.emoji}</div>
                <div class="card-name">${card.name}</div>
            `;
            
            // ドラッグ開始イベント
            const startDrag = (e) => {
                if (this.player.elixir < card.cost || this.state !== 'PLAY') return;
                e.preventDefault();
                this.draggingCardIndex = idx;
                this.draggingCard = card;
                
                // 画面を追従するダミー要素を作成
                this.dragEl = div.cloneNode(true);
                this.dragEl.style.position = 'fixed';
                this.dragEl.style.pointerEvents = 'none';
                this.dragEl.style.zIndex = 1000;
                this.dragEl.style.transform = 'scale(1.2)';
                this.dragEl.style.opacity = '0.9';
                document.body.appendChild(this.dragEl);
                this.moveDragEvent(e); // 初期位置設定
            };

            div.addEventListener('mousedown', startDrag);
            div.addEventListener('touchstart', startDrag, { passive: false });
            this.cardsContainer.appendChild(div);
        });
        
        // NEXTカード表示
        let nextDiv = document.createElement('div');
        nextDiv.style = "width:12%; aspect-ratio:3/4; background:#555; border-radius:5px; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.8; font-size:10px; color:#ccc;";
        nextDiv.innerHTML = `NEXT<div style="font-size:20px; margin-top:2px;">${this.player.nextCard.emoji}</div>`;
        this.cardsContainer.appendChild(nextDiv);
    }

    // Canvas内部の座標に変換する関数 (レスポンシブ対応)
    getCanvasPos(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    bindGlobalDragEvents() {
        this.moveDragEvent = (e) => {
            if (!this.draggingCard) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // ダミー要素を指の位置に移動 (カードの中心が指にくるように調整)
            const rect = this.dragEl.getBoundingClientRect();
            this.dragEl.style.left = (clientX - rect.width / 2) + 'px';
            this.dragEl.style.top = (clientY - rect.height) + 'px'; // 指より少し上に表示して隠れないように
            
            // 盤面上の座標を計算し、プレビュー用に保存
            this.previewPos = this.getCanvasPos(clientX, clientY);
        };

        const endDrag = (e) => {
            if (!this.draggingCard) return;
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const pos = this.getCanvasPos(clientX, clientY);
            
            // 自陣（画面下半分）でかつCanvas内の場合のみ配置
            if (pos.y >= this.height / 2 && pos.x >= 0 && pos.x <= this.width && pos.y <= this.height) {
                let card = this.player.useCard(this.draggingCardIndex);
                if(card) {
                    audio.playSpawn();
                    for(let i=0; i<card.count; i++) {
                        let offset = new Vec2(Utils.randomRange(-15,15), Utils.randomRange(-15,15));
                        this.spawnUnit(pos.x + offset.x, pos.y + offset.y, 0, card);
                    }
                    this.renderHandUI();
                }
            }
            
            // ドラッグ終了処理
            if(this.dragEl) { this.dragEl.remove(); this.dragEl = null; }
            this.draggingCard = null;
            this.draggingCardIndex = -1;
            this.previewPos = null;
        };

        document.addEventListener('mousemove', this.moveDragEvent);
        document.addEventListener('touchmove', this.moveDragEvent, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
    }

    spawnUnit(x, y, team, typeData) { this.units.push(new Unit(x, y, team, typeData)); }

    update(dt) {
        if(this.state !== 'PLAY') return;

        this.player.update(dt, this);
        this.enemy.update(dt, this);
        
        // エリクサーUIの更新
        document.getElementById('elixir-bar').style.width = `${(this.player.elixir / this.player.maxElixir) * 100}%`;
        document.getElementById('elixir-text').innerText = `${Math.floor(this.player.elixir)} / ${this.player.maxElixir}`;
        
        if(!this.draggingCard) this.renderHandUI(); // ドラッグ中でなければUI更新（コストの色変え）

        this.towers.forEach(t => t.update(dt, this));
        this.units.forEach(u => u.update(dt, this));
        this.particles.update(dt);

        let towerCount = this.towers.length;
        this.towers = this.towers.filter(t => t.active);
        if(this.towers.length < towerCount) {
             audio.playTowerDestroy();
             this.checkWinCondition();
        }
        this.units = this.units.filter(u => u.active);
    }
    
    checkWinCondition() {
        let pKing = this.towers.find(t => t.team === 0 && t.isKing);
        let eKing = this.towers.find(t => t.team === 1 && t.isKing);
        if(!pKing) this.gameOver("LOSE...");
        else if(!eKing) this.gameOver("WIN!!");
    }
    
    gameOver(msg) {
        this.state = 'OVER';
        let overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        overlay.innerHTML = `<h1 style="color:#ffeb3b; font-size:40px; text-shadow:2px 2px 0 #000;">${msg}</h1><button onclick="location.reload()">RETRY</button>`;
    }

    draw() {
        // フィールドと川
        this.ctx.fillStyle = '#689f38'; // 草むら
        this.ctx.fillRect(0, 0, this.width, this.height);
        this.ctx.fillStyle = '#29b6f6'; // 川
        this.ctx.fillRect(0, this.height/2 - 20, this.width, 40);
        this.ctx.fillStyle = '#8d6e63'; // 橋
        this.ctx.fillRect(60, this.height/2 - 20, 40, 40);
        this.ctx.fillRect(this.width - 100, this.height/2 - 20, 40, 40);

        // 自陣・敵陣の境界線ハイライト（ドラッグ中）
        if(this.draggingCard) {
            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            this.ctx.fillRect(0, this.height/2, this.width, this.height/2); // 自陣ハイライト
        }

        this.towers.forEach(t => t.draw(this.ctx));
        this.units.forEach(u => u.draw(this.ctx));
        this.particles.draw(this.ctx);
        
        // 配置プレビュー（ドラッグ中のカーソル位置）
        if(this.draggingCard && this.previewPos) {
            this.ctx.beginPath();
            this.ctx.arc(this.previewPos.x, this.previewPos.y, this.draggingCard.radius, 0, Math.PI * 2);
            // 自陣なら青枠、敵陣なら赤枠
            this.ctx.strokeStyle = this.previewPos.y >= this.height/2 ? '#fff' : 'rgba(255, 0, 0, 0.8)';
            this.ctx.lineWidth = 3;
            this.ctx.setLineDash([5, 5]);
            this.ctx.stroke();
            this.ctx.setLineDash([]);
            
            // プレビュー絵文字
            this.ctx.globalAlpha = 0.5;
            this.ctx.font = `${this.draggingCard.radius * 1.5}px sans-serif`;
            this.ctx.textAlign = "center";
            this.ctx.textBaseline = "middle";
            this.ctx.fillText(this.draggingCard.emoji, this.previewPos.x, this.previewPos.y);
            this.ctx.globalAlpha = 1.0;
        }
    }

    loop(timestamp) {
        const dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;
        if(dt < 0.1) { this.update(dt); this.draw(); }
        requestAnimationFrame((ts) => this.loop(ts));
    }
}

document.getElementById('start-btn').addEventListener('click', () => {
    audio.init();
    document.getElementById('overlay').style.display = 'none';
    const game = new GameEngine();
    game.state = 'PLAY';
    requestAnimationFrame((ts) => { game.lastTime = ts; game.loop(ts); });
});
</script>
