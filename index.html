<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無限コインドロップ・ルーレット</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding-top: 30px;
        }
        h1 {
            color: #ffcc00;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 5px;
        }
        #coin-board {
            background-color: #16213e;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            border: 2px solid #0f3460;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #roulette-container {
            position: relative;
            margin: 10px;
        }
        #pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff3333;
            z-index: 10;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.6));
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background-color: #fff;
        }
        .controls {
            margin-top: 25px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 2px rgba(0,0,0,0.4);
        }
        #start-btn {
            background-color: #e94560;
            color: white;
        }
        #stop-btn {
            background-color: #0f3460;
            color: white;
        }
        button:disabled {
            background-color: #555 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            text-align: center;
            min-height: 60px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>無限ルーレット チャンス！</h1>
    <div id="coin-board">所持コイン: <span id="coin-count">1000</span></div>

    <div id="roulette-container">
        <div id="pointer"></div>
        <canvas id="rouletteCanvas" width="350" height="350"></canvas>
    </div>

    <div class="controls">
        <button id="start-btn">100コインでスタート</button>
        <button id="stop-btn" disabled>ストップ！</button>
    </div>

    <div id="result"></div>

    <script>
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultDisplay = document.getElementById('result');
        const coinCountDisplay = document.getElementById('coin-count');

        let totalCoins = 1000; // 初期コイン
        const PLAY_COST = 100;

        // 盤面定義（確率と面積を一致させるため4分割）
        const prizes = [
            { text: "50コイン", color: "#FFD700" }, // 0: ゴールド
            { text: "25コイン", color: "#00BFFF" }, // 1: ブルー
            { text: "失敗", color: "#8B4513" },   // 2: ブラウン
            { text: "25コイン", color: "#00BFFF" }  // 3: ブルー
        ];

        const numPrizes = prizes.length;
        const arc = Math.PI * 2 / numPrizes; // 1マスの角度 (90度)
        
        let currentAngle = 0;
        let isSpinning = false;
        let isDecelerating = false; // 減速中フラグ
        let animationStartTime = 0;
        let startAngle = 0;
        let targetAngle = 0;
        
        const SPIN_SPEED = 0.15; // 定速回転時のスピード
        const DURATION = 3500; // ストップボタンを押してから止まるまでの時間(ミリ秒)

        // イージング関数（滑らかに減速してピタッと止まる計算）
        function easeOutQuart(x) {
            return 1 - Math.pow(1 - x, 4);
        }

        // コイン表示更新
        function updateCoinDisplay() {
            coinCountDisplay.innerText = totalCoins;
        }

        // ルーレットを描画する関数
        function drawRoulette() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            for (let i = 0; i < numPrizes; i++) {
                const angle = currentAngle + i * arc;

                // セグメント（扇形）の描画
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.stroke();

                // テキストの描画
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = prizes[i].color === "#8B4513" ? "#FFF" : "#000";
                ctx.font = "bold 26px sans-serif";
                ctx.fillText(prizes[i].text, radius - 30, 8);
                ctx.restore();
            }
        }

        // 回転アニメーション
        function animate() {
            if (isSpinning) {
                if (!isDecelerating) {
                    // 通常の回転
                    currentAngle += SPIN_SPEED;
                    drawRoulette();
                    requestAnimationFrame(animate);
                } else {
                    // 減速中の回転（目標の角度へ向かう）
                    let elapsed = Date.now() - animationStartTime;
                    let progress = Math.min(elapsed / DURATION, 1);
                    
                    let ease = easeOutQuart(progress);
                    currentAngle = startAngle + (targetAngle - startAngle) * ease;
                    
                    drawRoulette();
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // 完全に停止
                        isSpinning = false;
                        isDecelerating = false;
                        determineResult();
                    }
                }
            }
        }

        // スピン開始処理（isInitial: true=初回100消費, false=継続消費なし）
        function startSpin(isInitial) {
            if (isInitial) {
                if (totalCoins < PLAY_COST) {
                    alert("コインが足りません！");
                    return;
                }
                totalCoins -= PLAY_COST;
                updateCoinDisplay();
                resultDisplay.innerHTML = "ルーレット回転中...<br><span style='font-size:18px; color:#aaa;'>好きなタイミングでストップ！</span>";
            } else {
                resultDisplay.innerHTML = "連続プレイ中！<br><span style='font-size:18px; color:#aaa;'>好きなタイミングでストップ！</span>";
            }
            
            resultDisplay.style.color = "#fff";
            isSpinning = true;
            isDecelerating = false;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            
            animate();
        }

        // ストップ（目押し不能・内部抽選ロジック）
        stopBtn.addEventListener('click', () => {
            if (isSpinning && !isDecelerating) {
                isDecelerating = true;
                stopBtn.disabled = true;

                // 【ここで内部抽選】
                let r = Math.random();
                let targetIndex;
                if (r < 0.25) {
                    targetIndex = 2; // 25% 失敗マス
                } else if (r < 0.75) {
                    targetIndex = Math.random() < 0.5 ? 1 : 3; // 50% 25コインマス（2箇所あるのでランダムに散らす）
                } else {
                    targetIndex = 0; // 25% 50コインマス
                }

                // 決定したマスが真上(270度)に来るための角度を逆算
                let baseTargetAngle = (Math.PI * 1.5 - (targetIndex * arc + arc / 2)) % (Math.PI * 2);
                if (baseTargetAngle < 0) baseTargetAngle += Math.PI * 2;
                
                // 現在の角度から目標角度までの差分を計算
                let currentMod = currentAngle % (Math.PI * 2);
                let diff = baseTargetAngle - currentMod;
                if (diff < 0) diff += Math.PI * 2;
                
                // すぐ止まると不自然なので、さらに3回転（Math.PI * 2 * 3）させてから止める
                startAngle = currentAngle;
                targetAngle = currentAngle + diff + (Math.PI * 2 * 3);
                animationStartTime = Date.now();
            }
        });

        // 結果発表と継続判定
        function determineResult() {
            // 真上にきているマスを取得
            let normalizedAngle = currentAngle % (Math.PI * 2);
            if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;
            let pointerAngle = (Math.PI * 1.5 - normalizedAngle + Math.PI * 2) % (Math.PI * 2);
            let winningIndex = Math.floor(pointerAngle / arc);
            
            const prize = prizes[winningIndex];
            
            if (prize.text === "失敗") {
                resultDisplay.innerHTML = "😭 失敗...<br><span style='font-size:18px;'>連続プレイ終了。</span>";
                resultDisplay.style.color = "#ff4444";
                startBtn.disabled = false; // 最初からやり直し可能に
            } else {
                let addCoins = parseInt(prize.text);
                totalCoins += addCoins;
                updateCoinDisplay();
                
                resultDisplay.innerHTML = `🎉 ${prize.text} 獲得！<br><span style='font-size:18px;'>もう1回転スタートします...</span>`;
                resultDisplay.style.color = "#FFD700";
                
                // 1.5秒後に自動で次の回転をスタート
                setTimeout(() => {
                    startSpin(false); 
                }, 1500);
            }
        }

        // 初期描画
        drawRoulette();
        updateCoinDisplay();

        // 最初のスタートボタン
        startBtn.addEventListener('click', () => {
            if (!isSpinning) {
                startSpin(true);
            }
        });
    </script>
</body>
</html>
