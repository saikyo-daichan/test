<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sweet Fruit Bonanza - Enhanced</title>
<style>
    :root {
        --primary: #ff007f;
        --secondary: #ffb800;
        --bg-color: #1a0b2e;
        --board-bg: rgba(20, 10, 40, 0.8);
        --text-color: #ffffff;
        --grid-gap: 8px;
        --cell-size: 80px;
    }
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #3a1c71, #d76d77, #ffaf7b);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-color);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        user-select: none;
        touch-action: none; /* スマホでのスクロールを防止 */
    }
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    #fx-canvas {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 100;
    }
    #game-wrapper {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        width: max-content;
        transform-origin: center center;
    }
    #header-ui {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 20px;
        gap: 10px;
    }
    .info-box {
        background: linear-gradient(135deg, #2c3e50, #000000);
        padding: 10px 15px;
        border-radius: 10px;
        border: 2px solid var(--secondary);
        font-size: 20px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
    }
    .info-box span { color: var(--secondary); }
    #board-container {
        position: relative;
        width: calc((var(--cell-size) * 6) + (var(--grid-gap) * 5) + 20px);
        height: calc((var(--cell-size) * 5) + (var(--grid-gap) * 4) + 20px);
        background: var(--board-bg);
        border: 4px solid var(--primary);
        border-radius: 15px;
        padding: 10px;
        box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
        overflow: hidden;
    }
    .cell {
        position: absolute;
        width: var(--cell-size);
        height: var(--cell-size);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50px;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, filter 0.3s, background 0.3s;
        box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
        will-change: transform, opacity;
    }
    /* 追加：揃った時のハイライト演出 */
    .cell.highlight {
        transform: scale(1.15);
        filter: brightness(1.5) drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
        z-index: 5;
        background: rgba(255, 255, 255, 0.2);
    }
    .cell.bomb {
        font-size: 40px;
        text-shadow: 0 0 15px red;
        animation: pulse 1s infinite alternate;
    }
    .bomb-multiplier {
        position: absolute;
        bottom: 5px; right: 5px;
        font-size: 16px; font-weight: bold; color: yellow;
        background: rgba(0,0,0,0.7);
        padding: 2px 5px; border-radius: 5px;
    }
    @keyframes pulse {
        from { transform: scale(1); filter: drop-shadow(0 0 5px red); }
        to { transform: scale(1.1); filter: drop-shadow(0 0 20px red); }
    }
    .cell.matched {
        transform: scale(1.3);
        opacity: 0;
        filter: brightness(2) contrast(2);
    }
    
    /* スマホ向けにボタンレイアウトを調整 */
    #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
        align-items: center;
        width: 100%;
        justify-content: center;
    }
    .btn {
        padding: 15px 10px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
        color: white;
        box-shadow: 0 6px 0px rgba(0,0,0,0.5);
    }
    .btn:active {
        transform: translateY(6px);
        box-shadow: 0 0px 0px rgba(0,0,0,0.5);
    }
    .btn:disabled {
        filter: grayscale(1);
        cursor: not-allowed;
        opacity: 0.5;
    }
    #spin-btn { background: linear-gradient(to bottom, #00ff87, #60efff); color: #000; font-size: 22px; flex: 1 1 45%; }
    #buy-fs-btn { background: linear-gradient(to bottom, #ff007f, #7f00ff); flex: 1 1 45%; line-height: 1.2; }
    .bet-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 10px;
        flex: 1 1 100%;
    }
    .bet-btn { background: #444; color: white; border: none; padding: 10px 20px; font-size: 20px; border-radius: 5px; cursor: pointer;}
    .bet-btn:hover { background: #666; }
    
    #overlay-msg {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 70px;
        font-weight: 900;
        color: #ffd700;
        text-shadow: 0 0 20px #ff0000, 4px 4px 0 #000;
        z-index: 200;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none;
        white-space: nowrap;
    }
    .show-msg { transform: translate(-50%, -50%) scale(1) !important; }
    
    #fs-counter {
        position: absolute;
        top: -25px; left: 50%;
        transform: translateX(-50%);
        background: #ff007f;
        color: white;
        padding: 5px 20px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 20px;
        box-shadow: 0 0 15px #ff007f;
        display: none;
        z-index: 20;
    }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div id="game-wrapper">
    <div id="header-ui">
        <div class="info-box">💰 <span id="balance">1,000,000</span></div>
        <div class="info-box">WIN🏆 <span id="win-amount">0</span></div>
    </div>
    
    <div id="board-container">
        <div id="fs-counter">FREE SPINS: <span id="fs-left">0</span></div>
        <div id="board"></div>
        <div id="overlay-msg"></div>
    </div>

    <div id="controls">
        <div class="bet-controls">
            <button class="bet-btn" id="bet-down">➖</button>
            <div class="info-box" style="font-size:18px; padding: 5px 10px;">BET: <span id="bet-amount">1,000</span></div>
            <button class="bet-btn" id="bet-up">➕</button>
        </div>
        <button class="btn" id="buy-fs-btn">BUY BONUS<br><span id="buy-fs-cost">100,000</span></button>
        <button class="btn" id="spin-btn">SPIN</button>
    </div>
</div>

<script>
/**
 * ----------------------------------------------------
 * CONFIGURATION & DATA 
 * ----------------------------------------------------
 */
const ROWS = 5;
const COLS = 6;
const CELL_SIZE = 80;
const GRID_GAP = 8;
const DROP_DELAY = 50; 
const ANIM_DURATION = 400;

const betLevels = [];
for(let i=1; i<=9; i++) betLevels.push(i*1000); 
for(let i=1; i<=100; i++) { 
    if(i*10000 >= 10000) betLevels.push(i*10000);
}

const SYMBOL_DATA = {
    1: { icon: '🍎', pays: [2, 5, 10], weight: 40 },
    2: { icon: '🍇', pays: [1.5, 4, 8], weight: 50 },
    3: { icon: '🍉', pays: [1.2, 3, 6], weight: 60 },
    4: { icon: '🍌', pays: [1, 2, 4], weight: 70 },
    5: { icon: '🍒', pays: [0.8, 1.5, 3], weight: 80 },
    6: { icon: '🍓', pays: [0.5, 1.2, 2], weight: 90 },
    7: { icon: '🍊', pays: [0.4, 0.9, 1.5], weight: 100 },
    8: { icon: '🍍', pays: [0.3, 0.8, 1.2], weight: 110 },
    9: { icon: '🍋', pays: [0.25, 0.75, 1], weight: 120 }
};
const SCATTER = { id: 99, icon: '🍭', weight: 4 }; 
const BOMB = { id: 100, icon: '💣' };
const BOMB_MULTIPLIERS = [2, 3, 5, 8, 10, 15, 25, 50, 100];

let symbolPool = [];
for(let id in SYMBOL_DATA) {
    for(let i=0; i<SYMBOL_DATA[id].weight; i++) symbolPool.push(parseInt(id));
}
for(let i=0; i<SCATTER.weight; i++) symbolPool.push(SCATTER.id);

let state = {
    balance: 1000000,
    betIndex: 0,
    bet: betLevels[0],
    isSpinning: false,
    freeSpins: 0,
    isFreeSpinMode: false,
    currentWin: 0,
    totalWin: 0,
    board: [], 
    audioInitialized: false
};

/**
 * ----------------------------------------------------
 * AUDIO ENGINE
 * ----------------------------------------------------
 */
let audioCtx;
const AudioEngine = {
    init: function() {
        if(state.audioInitialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        state.audioInitialized = true;
    },
    playTone: function(freq, type, duration, vol=0.1) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    },
    playSpin: () => AudioEngine.playTone(400, 'sine', 0.1, 0.05),
    playDrop: () => AudioEngine.playTone(150, 'triangle', 0.1, 0.1),
    playMatch: () => {
        AudioEngine.playTone(600, 'square', 0.1, 0.05);
        setTimeout(() => AudioEngine.playTone(800, 'square', 0.2, 0.05), 100);
    },
    playScatter: () => {
        AudioEngine.playTone(880, 'sine', 0.3, 0.1);
        setTimeout(() => AudioEngine.playTone(1760, 'sine', 0.5, 0.1), 150);
    },
    playBomb: () => {
        if(!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    },
    playBigWin: () => {
        let t = 0;
        [440, 554, 659, 880, 1108, 1318, 1760].forEach(f => {
            setTimeout(() => AudioEngine.playTone(f, 'sine', 0.3, 0.1), t);
            t += 100;
        });
    }
};

/**
 * ----------------------------------------------------
 * RESPONSIVE & PARTICLES
 * ----------------------------------------------------
 */
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

// スマホ向けに画面サイズを計算して全体をスケーリング
function resizeGame() {
    const wrapper = document.getElementById('game-wrapper');
    wrapper.style.transform = 'scale(1)'; // 一旦リセットして実測
    const width = wrapper.offsetWidth;
    const height = wrapper.offsetHeight;
    
    const scaleX = window.innerWidth / (width + 20); // 左右の余白考慮
    const scaleY = window.innerHeight / (height + 20); // 上下の余白考慮
    const scale = Math.min(scaleX, scaleY, 1); // 1倍以上に拡大はしない
    
    wrapper.style.transform = `scale(${scale})`;
}

window.addEventListener('resize', () => {
    resizeCanvas();
    resizeGame();
});
resizeCanvas();
resizeGame();

class Particle {
    constructor(x, y, color, type='circle') {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 15;
        this.vy = (Math.random() - 0.5) * 15 - 5;
        this.gravity = 0.4;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.01;
        this.color = color;
        this.size = Math.random() * 8 + 4;
        this.type = type;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.2;
    }
    update() {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.spin;
        this.life -= this.decay;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        if(this.type === 'rect') {
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        } else if(this.type === 'text') {
            ctx.font = `${this.size*3}px Arial`;
            ctx.fillText('💲', 0, 0);
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if(particles[i].life <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();

function spawnExplosion(x, y, color, count=20) {
    for(let i=0; i<count; i++) particles.push(new Particle(x, y, color, Math.random()>0.5?'circle':'rect'));
}
function spawnCoinShower() {
    for(let i=0; i<100; i++) {
        setTimeout(() => {
            let p = new Particle(Math.random() * canvas.width, -20, '#ffd700', 'text');
            p.vx = (Math.random() - 0.5) * 5;
            p.vy = Math.random() * 5 + 2;
            particles.push(p);
        }, i * 20);
    }
}

/**
 * ----------------------------------------------------
 * DOM & UI BINDING
 * ----------------------------------------------------
 */
const boardEl = document.getElementById('board');
const balanceEl = document.getElementById('balance');
const winEl = document.getElementById('win-amount');
const betEl = document.getElementById('bet-amount');
const spinBtn = document.getElementById('spin-btn');
const buyBtn = document.getElementById('buy-fs-btn');
const buyCostEl = document.getElementById('buy-fs-cost');
const betUpBtn = document.getElementById('bet-up');
const betDownBtn = document.getElementById('bet-down');
const overlayMsg = document.getElementById('overlay-msg');
const fsCounter = document.getElementById('fs-counter');
const fsLeftEl = document.getElementById('fs-left');

function formatCurrency(num) { return num.toLocaleString('en-US'); }

function updateUI() {
    balanceEl.textContent = formatCurrency(state.balance);
    betEl.textContent = formatCurrency(state.bet);
    buyCostEl.textContent = formatCurrency(state.bet * 100);
    winEl.textContent = formatCurrency(state.totalWin);
    
    let canBuy = !state.isSpinning && state.balance >= state.bet * 100 && !state.isFreeSpinMode;
    
    spinBtn.disabled = state.isSpinning || (!state.isFreeSpinMode && state.balance < state.bet);
    buyBtn.disabled = !canBuy;
    betUpBtn.disabled = state.isSpinning || state.betIndex === betLevels.length - 1;
    betDownBtn.disabled = state.isSpinning || state.betIndex === 0;

    if(state.isFreeSpinMode) {
        fsCounter.style.display = 'block';
        fsLeftEl.textContent = state.freeSpins;
    } else {
        fsCounter.style.display = 'none';
    }
}

betUpBtn.onclick = () => { AudioEngine.init(); if(state.betIndex < betLevels.length-1) { state.betIndex++; state.bet = betLevels[state.betIndex]; updateUI(); }};
betDownBtn.onclick = () => { AudioEngine.init(); if(state.betIndex > 0) { state.betIndex--; state.bet = betLevels[state.betIndex]; updateUI(); }};

document.addEventListener('click', AudioEngine.init, {once: true});
document.addEventListener('touchstart', AudioEngine.init, {once: true});

function showMessage(text, duration=2000) {
    return new Promise(resolve => {
        overlayMsg.textContent = text;
        overlayMsg.classList.add('show-msg');
        if(text.includes("WIN") || text.includes("BONUS")) AudioEngine.playBigWin();
        setTimeout(() => {
            overlayMsg.classList.remove('show-msg');
            setTimeout(resolve, 500);
        }, duration);
    });
}

/**
 * ----------------------------------------------------
 * GAME LOGIC
 * ----------------------------------------------------
 */
function getPos(col, row) {
    return {
        x: col * (CELL_SIZE + GRID_GAP) + 10,
        y: row * (CELL_SIZE + GRID_GAP) + 10
    };
}

function getRandomSymbol() {
    if(state.isFreeSpinMode && Math.random() < 0.06) {
        let mult = BOMB_MULTIPLIERS[Math.floor(Math.random() * BOMB_MULTIPLIERS.length)];
        return { id: BOMB.id, icon: BOMB.icon, mult: mult };
    }
    let id = symbolPool[Math.floor(Math.random() * symbolPool.length)];
    return { id: id, icon: id === SCATTER.id ? SCATTER.icon : SYMBOL_DATA[id].icon };
}

function createDOMCell(col, row, symbol) {
    let div = document.createElement('div');
    div.className = 'cell';
    div.dataset.col = col;
    div.dataset.row = row;
    
    if(symbol.id === BOMB.id) {
        div.classList.add('bomb');
        div.innerHTML = `${symbol.icon}<div class="bomb-multiplier">x${symbol.mult}</div>`;
    } else {
        div.textContent = symbol.icon;
    }
    
    let pos = getPos(col, row);
    div.style.left = `${pos.x}px`;
    div.style.top = `${pos.y}px`;
    boardEl.appendChild(div);
    return div;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// フリースピン購入時は、強制的にスキャッターを4つ配置する
async function generateInitialBoard(forceScatters = false) {
    boardEl.innerHTML = '';
    state.board = [];
    
    let scPositions = [];
    if(forceScatters) {
        while(scPositions.length < 4) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            if(!scPositions.find(p => p.r === r && p.c === c)) {
                scPositions.push({r, c});
            }
        }
    }

    for(let c=0; c<COLS; c++) {
        state.board[c] = [];
        for(let r=0; r<ROWS; r++) {
            let sym;
            // 確定スキャッター配置
            if(forceScatters && scPositions.find(p => p.r === r && p.c === c)) {
                sym = { id: SCATTER.id, icon: SCATTER.icon };
            } else {
                sym = getRandomSymbol();
            }
            
            let dom = createDOMCell(c, r, sym);
            dom.style.transform = `translateY(-${(ROWS + 1) * 100}px)`;
            state.board[c][r] = { ...sym, dom: dom, row: r, col: c };
        }
    }
    
    for(let r=ROWS-1; r>=0; r--) {
        for(let c=0; c<COLS; c++) {
            setTimeout(() => {
                state.board[c][r].dom.style.transform = `translateY(0px)`;
                AudioEngine.playDrop();
            }, (ROWS - 1 - r) * DROP_DELAY + (c * 20));
        }
    }
    await sleep(ROWS * DROP_DELAY + COLS * 20 + ANIM_DURATION);
}

function findMatches() {
    let counts = {};
    for(let c=0; c<COLS; c++) {
        for(let r=0; r<ROWS; r++) {
            let id = state.board[c][r].id;
            if(id === BOMB.id || id === SCATTER.id) continue;
            counts[id] = (counts[id] || 0) + 1;
        }
    }
    
    let matchedCells = [];
    let spinWin = 0;
    
    for(let c=0; c<COLS; c++) {
        for(let r=0; r<ROWS; r++) {
            let cell = state.board[c][r];
            let id = cell.id;
            if(counts[id] >= 8) {
                matchedCells.push(cell);
            }
        }
    }
    
    for(let id in counts) {
        if(counts[id] >= 8) {
            let count = counts[id];
            let payIndex = count >= 12 ? 2 : (count >= 10 ? 1 : 0);
            let mult = SYMBOL_DATA[id].pays[payIndex];
            spinWin += state.bet * mult;
        }
    }
    
    return { cells: matchedCells, win: spinWin };
}

async function processCascade() {
    let matchData = findMatches();
    if(matchData.cells.length === 0) return false; 
    
    state.currentWin += matchData.win;
    winEl.textContent = formatCurrency(state.currentWin);
    AudioEngine.playMatch();
    
    // ワンテンポ待機（どこが揃ったか視認しやすくする）
    matchData.cells.forEach(cell => {
        cell.dom.classList.add('highlight');
    });
    
    await sleep(800); // ここで0.8秒待つ！
    
    // 消去アニメーション
    matchData.cells.forEach(cell => {
        cell.dom.classList.remove('highlight');
        cell.dom.classList.add('matched');
        let rect = cell.dom.getBoundingClientRect();
        spawnExplosion(rect.left + rect.width/2, rect.top + rect.height/2, '#fff');
    });
    
    await sleep(400); 
    
    matchData.cells.forEach(cell => {
        cell.dom.remove();
        state.board[cell.col][cell.row] = null;
    });
    
    let dropsOccurred = false;
    for(let c=0; c<COLS; c++) {
        let emptySpaces = 0;
        for(let r=ROWS-1; r>=0; r--) {
            if(state.board[c][r] === null) {
                emptySpaces++;
            } else if(emptySpaces > 0) {
                let cell = state.board[c][r];
                state.board[c][r + emptySpaces] = cell;
                state.board[c][r] = null;
                cell.row = r + emptySpaces;
                
                let newPos = getPos(cell.col, cell.row);
                cell.dom.style.top = `${newPos.y}px`;
                dropsOccurred = true;
                setTimeout(AudioEngine.playDrop, 200);
            }
        }
        
        for(let r=0; r<emptySpaces; r++) {
            let sym = getRandomSymbol();
            let dom = createDOMCell(c, r, sym);
            dom.style.transform = `translateY(-${(ROWS + 1) * 100}px)`;
            state.board[c][r] = { ...sym, dom: dom, row: r, col: c };
            
            setTimeout(() => {
                state.board[c][r].dom.style.transform = `translateY(0px)`;
                AudioEngine.playDrop();
            }, (emptySpaces - r) * DROP_DELAY);
            dropsOccurred = true;
        }
    }
    
    if(dropsOccurred) {
        await sleep(300 + ROWS * DROP_DELAY); 
    }
    
    return true; 
}

async function processBombs() {
    if(state.currentWin === 0) return; 
    
    let bombs = [];
    for(let c=0; c<COLS; c++) {
        for(let r=0; r<ROWS; r++) {
            if(state.board[c][r].id === BOMB.id) {
                bombs.push(state.board[c][r]);
            }
        }
    }
    
    if(bombs.length > 0) {
        let totalMultiplier = 0;
        for(let b of bombs) {
            totalMultiplier += b.mult;
            b.dom.style.transform = 'scale(1.5)';
            b.dom.style.zIndex = 100;
            b.dom.style.filter = 'drop-shadow(0 0 30px yellow)';
            AudioEngine.playBomb();
            let rect = b.dom.getBoundingClientRect();
            spawnExplosion(rect.left + rect.width/2, rect.top + rect.height/2, '#ff0000', 50);
            await sleep(500);
        }
        
        await showMessage(`MULTIPLIER x${totalMultiplier}!`, 1500);
        state.currentWin *= totalMultiplier;
        winEl.textContent = formatCurrency(state.currentWin);
    }
}

async function checkFreeSpins(scattersCount) {
    if(scattersCount >= 4) {
        AudioEngine.playScatter();
        state.board.flat().forEach(c => {
            if(c && c.id === SCATTER.id) c.dom.style.animation = 'pulse 0.5s infinite';
        });
        await showMessage("FREE SPINS WON!", 3000);
        state.freeSpins += 10;
        state.isFreeSpinMode = true;
        updateUI();
    }
}

async function playSpinRound(forceScatters = false) {
    state.currentWin = 0;
    winEl.textContent = '0';
    
    await generateInitialBoard(forceScatters);
    
    let chainActive = true;
    while(chainActive) {
        chainActive = await processCascade();
    }
    
    await processBombs();
    
    if(state.currentWin > 0) {
        state.totalWin += state.currentWin;
        state.balance += state.currentWin;
        if(state.currentWin >= state.bet * 10) {
            spawnCoinShower();
            await showMessage(`BIG WIN! ${formatCurrency(state.currentWin)}`, 3000);
        } else {
            await showMessage(`WIN ${formatCurrency(state.currentWin)}`, 1000);
        }
    }
    
    let finalScatters = 0;
    for(let c=0; c<COLS; c++) {
        for(let r=0; r<ROWS; r++) {
            if(state.board[c][r] && state.board[c][r].id === SCATTER.id) finalScatters++;
        }
    }
    // 購入時の確定スピン or 自力で引いた場合のみFS判定を通す
    if(!state.isFreeSpinMode || forceScatters) {
        await checkFreeSpins(finalScatters);
    }
    
    updateUI();
}

async function startSpin(isBuy = false) {
    if(state.isSpinning) return;
    AudioEngine.init();
    
    let cost = isBuy ? state.bet * 100 : state.bet;
    if(!state.isFreeSpinMode && state.balance < cost) return;
    
    state.isSpinning = true;
    
    if(!state.isFreeSpinMode) {
        state.balance -= cost;
        state.totalWin = 0; 
    }
    updateUI();
    
    if(isBuy) {
        // 購入時はスキャッター4つ確定の特殊スピンを1回回して演出を見せる
        await showMessage("BONUS BOUGHT!", 2000);
        await playSpinRound(true);
        await sleep(1000);
    } else if (!state.isFreeSpinMode) {
        // 通常スピン
        await playSpinRound(false);
    }
    
    // フリースピン突入していたらループ開始
    while (state.isFreeSpinMode && state.freeSpins > 0) {
        state.freeSpins--;
        updateUI();
        
        await playSpinRound(false);
        
        if(state.isFreeSpinMode && state.freeSpins > 0) {
            await sleep(1000); 
        }
    }
    
    if(state.isFreeSpinMode && state.freeSpins === 0) {
        await showMessage(`TOTAL BONUS WIN: ${formatCurrency(state.totalWin)}`, 4000);
        state.isFreeSpinMode = false;
    }
    
    state.isSpinning = false;
    updateUI();
}

spinBtn.onclick = () => startSpin(false);
buyBtn.onclick = () => startSpin(true);

updateUI();

</script>
